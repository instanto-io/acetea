name: Build AceTea and publish showcase
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  # Required to publish SpotBugs SARIF to code scanning.
  security-events: write
concurrency:
  group: acetea-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, instanto-container]
    timeout-minutes: 30
    env:
      FORGEJO_PACKAGE_USER: ${{ secrets.FORGEJO_PACKAGE_USER }}
      FORGEJO_PACKAGE_TOKEN: ${{ secrets.FORGEJO_PACKAGE_TOKEN || secrets.FORGEJO_PACKAGES_TOKEN || secrets.FORGEJO_PACKAGE_READ_TOKEN }}
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '0'
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          overwrite-settings: false
      - name: Allocate browser cache
        run: echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/acetea-browsers-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"
      - name: Build and install reactor artifacts
        run: >-
          mvn --settings .github/maven-settings.xml --batch-mode --no-transfer-progress
          --update-snapshots
          -Dmaven.repo.local="$RUNNER_TEMP/acetea-m2-${{ github.run_id }}-${{ github.run_attempt }}"
          clean install -DskipTests
      # System libraries are supplied by the runner image.
      - name: Install Chromium and WebKit
        run: >-
          mvn --settings .github/maven-settings.xml --batch-mode --no-transfer-progress
          -Dmaven.repo.local="$RUNNER_TEMP/acetea-m2-${{ github.run_id }}-${{ github.run_attempt }}"
          -f acegwt-demo/pom.xml
          org.codehaus.mojo:exec-maven-plugin:3.5.0:java
          -Dexec.classpathScope=test -Dexec.mainClass=com.microsoft.playwright.CLI
          -Dexec.args="install chromium webkit"
      - name: Verify browser contracts
        run: >-
          mvn --settings .github/maven-settings.xml --batch-mode --no-transfer-progress
          -Dmaven.repo.local="$RUNNER_TEMP/acetea-m2-${{ github.run_id }}-${{ github.run_attempt }}"
          verify
      - name: SonarQube analysis
        # Analysis belongs to the default branch only: a pull-request run would
        # otherwise replace the project's main analysis with unmerged code.
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && env.SONAR_TOKEN != ''
        continue-on-error: true
        env:
          SONAR_HOST_URL: https://sonar.instanto.io
        run: >-
          mvn --settings .github/maven-settings.xml --batch-mode --no-transfer-progress
          -Dmaven.repo.local="$RUNNER_TEMP/acetea-m2-${{ github.run_id }}-${{ github.run_attempt }}"
          sonar:sonar -Dsonar.projectKey=acetea -Dsonar.projectName=acetea
          -Dsonar.qualitygate.wait=true
      - name: Publish quality summary
        if: always()
        continue-on-error: true
        uses: instanto-io/instanto-poms/.github/actions/quality-summary@main
        with:
          sonar-project-key: acetea
          sonar-token: ${{ secrets.SONAR_READ_TOKEN || secrets.SONAR_TOKEN }}
      - name: Upload SpotBugs reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-reports
          path: '**/target/spotbugs/'
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-reports
          path: |
            acegwt-demo/target/failsafe-reports/
            acetea-gwt-demo/target/failsafe-reports/
      - name: Package showcase for GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: acegwt-demo/target/site
      - name: Clean job caches
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/acetea-m2-${{ github.run_id }}-${{ github.run_attempt }}" "$PLAYWRIGHT_BROWSERS_PATH"
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy showcase
        id: deployment
        uses: actions/deploy-pages@v4
